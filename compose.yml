name: postgres-13

services:
  postgres-13:
    build:
      context: .
    image: postgres-13-base:local
    container_name: postgres-13
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - postgres_13_data:/var/lib/postgresql/data

volumes:
  postgres_13_data:
